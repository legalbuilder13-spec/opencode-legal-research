name: legal live-web corpus
run-name: legal live-web corpus ${{ inputs.corpus_ref }}

on:
  workflow_dispatch:
    inputs:
      corpus_ref:
        description: Review batch identifier (no client or matter information)
        required: true
        default: candidate
        type: string

concurrency:
  group: legal-live-web-corpus-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  evaluate:
    name: ${{ matrix.name }} renderer and OCR corpus
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            artifact: macos-arm64
          - name: Windows x64
            runner: windows-2025
            artifact: windows-x64
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout corpus and implementation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate fork and non-sensitive batch identifier
        shell: bash
        env:
          CORPUS_REF: ${{ inputs.corpus_ref }}
        run: |
          test "$GITHUB_REPOSITORY" = "legalbuilder13-spec/opencode-legal-research"
          [[ "$CORPUS_REF" =~ ^[a-z0-9][a-z0-9._-]{0,39}$ ]]

      - name: Setup Bun and workspace on macOS/Linux
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-bun

      - name: Setup Node on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun executable on Windows
        if: runner.os == 'Windows'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install workspace dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install setuptools
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            bun install --linker hoisted
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning "Bun install attempt $attempt failed; retrying the Windows cache race"
            Start-Sleep -Seconds (5 * $attempt)
          }
          exit 1

      - name: Setup pinned uv builder
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.13
          enable-cache: false

      - name: Build relocatable offline evidence worker
        working-directory: packages/desktop
        timeout-minutes: 45
        env:
          UV: uv
        run: bun ./scripts/build-evidence-worker.ts "${{ runner.temp }}/legal-evidence-worker"

      - name: Verify dependency and model receipt
        working-directory: packages/desktop
        run: bun ./scripts/evidence-worker-license-audit.ts "${{ runner.temp }}/legal-evidence-worker"

      - name: Run live renderer/OCR corpus on macOS or Windows
        if: runner.os != 'Linux'
        working-directory: packages/desktop
        timeout-minutes: 20
        env:
          LEGAL_EVIDENCE_WORKER_DIR: ${{ runner.temp }}/legal-evidence-worker
          LEGAL_WEB_CORPUS_OUTPUT: ${{ runner.temp }}/legal-web-corpus
        run: bun ./scripts/run-legal-web-corpus.ts

      - name: Run live renderer/OCR corpus in Linux virtual display
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        timeout-minutes: 20
        env:
          LEGAL_EVIDENCE_WORKER_DIR: ${{ runner.temp }}/legal-evidence-worker
          LEGAL_WEB_CORPUS_OUTPUT: ${{ runner.temp }}/legal-web-corpus
        run: xvfb-run -a bun ./scripts/run-legal-web-corpus.ts

      - name: Upload review receipt and public-source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legal-live-web-${{ matrix.artifact }}-${{ inputs.corpus_ref }}
          path: ${{ runner.temp }}/legal-web-corpus
          if-no-files-found: error
          retention-days: 30
