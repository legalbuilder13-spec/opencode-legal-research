name: legal installation matrix

on:
  workflow_dispatch:
  push:
    branches:
      - legal-research
    paths:
      - ".github/workflows/legal-installations.yml"
      - "packages/desktop/electron-builder.config*"
      - "packages/desktop/scripts/build-evidence-worker.ts"
      - "packages/desktop/scripts/build-legal-workbench.ts"
      - "packages/desktop/scripts/build-unpacked-legal-installation.ts"
      - "packages/desktop/scripts/verify-legal-installation.ts"
      - "packages/legal-evidence-worker/**"
      - "packages/legal-workbench/**"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unpacked-installation:
    name: ${{ matrix.name }} unpacked legal installation
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
          - name: Windows x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-bun

      - name: Setup Node on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun executable on Windows
        if: runner.os == 'Windows'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install workspace dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install setuptools
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            bun install --linker hoisted
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning "Bun install attempt $attempt failed; retrying the Windows cache race"
            Start-Sleep -Seconds (5 * $attempt)
          }
          exit 1

      - name: Setup pinned uv builder
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.13
          enable-cache: false

      - name: Build relocatable Python, Docling, and OCR resource
        working-directory: packages/desktop
        timeout-minutes: 45
        env:
          UV: uv
        run: bun ./scripts/build-evidence-worker.ts "${{ runner.temp }}/legal-evidence-worker"

      - name: Verify dependency and model license receipt
        working-directory: packages/desktop
        run: bun ./scripts/evidence-worker-license-audit.ts "${{ runner.temp }}/legal-evidence-worker"

      - name: Build unpacked desktop and run installed legal sidecars
        working-directory: packages/desktop
        timeout-minutes: 45
        run: bun ./scripts/build-unpacked-legal-installation.ts "${{ runner.temp }}/legal-evidence-worker"
