name: legal research

on:
  push:
    branches:
      - legal-research
    paths:
      - ".github/workflows/legal-research.yml"
      - "packages/codex-app-server/**"
      - "packages/app/src/app.tsx"
      - "packages/app/src/i18n/en.ts"
      - "packages/app/src/pages/legal-research.tsx"
      - "packages/app/src/utils/legal-workbench-url*"
      - "packages/desktop/**"
      - "packages/legal-citation-spike/**"
      - "packages/legal-evaluation/**"
      - "packages/legal-evidence-worker/**"
      - "packages/legal-research-core/**"
      - "packages/legal-workbench/**"
      - "specs/legal-research/**"
      - "bun.lock"
      - "package.json"
  pull_request:
    paths:
      - ".github/workflows/legal-research.yml"
      - "packages/codex-app-server/**"
      - "packages/app/src/app.tsx"
      - "packages/app/src/i18n/en.ts"
      - "packages/app/src/pages/legal-research.tsx"
      - "packages/app/src/utils/legal-workbench-url*"
      - "packages/desktop/**"
      - "packages/legal-citation-spike/**"
      - "packages/legal-evaluation/**"
      - "packages/legal-evidence-worker/**"
      - "packages/legal-research-core/**"
      - "packages/legal-workbench/**"
      - "specs/legal-research/**"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  legal:
    name: legal TypeScript gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck workspace
        run: bun typecheck

      - name: Run legal unit and integration tests
        run: bun test:legal

      - name: Run primary-shell legal route tests
        working-directory: packages/app
        run: bun test --conditions=solid --preload ./happydom.ts ./src/utils/legal-workbench-url.test.ts

      - name: Build packaged legal workbench executable
        working-directory: packages/desktop
        run: bun ./scripts/build-legal-workbench.ts /tmp/legal-workbench

      - name: Run desktop legal sidecar tests
        working-directory: packages/desktop
        run: >-
          LEGAL_WORKBENCH_TEST_EXECUTABLE=/tmp/legal-workbench bun test
          ./src/main/legal-workbench.test.ts
          ./src/main/legal-web-renderer-policy.test.ts
          ./src/main/legal-web-renderer-proxy.test.ts
          ./src/main/legal-web-renderer-server.test.ts
          ./electron-builder.config.test.ts

  evidence-worker:
    name: packaged evidence worker gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install pinned uv builder
        run: python3 -m pip install --user --break-system-packages uv==0.11.13

      - name: Build relocatable Python, Docling, and OCR resource
        working-directory: packages/desktop
        timeout-minutes: 45
        env:
          UV: /home/runner/.local/bin/uv
        run: bun ./scripts/build-evidence-worker.ts /tmp/legal-evidence-worker

      - name: Run evidence worker tests from packaged Python
        working-directory: packages/legal-evidence-worker
        env:
          PYTHONPATH: /tmp/legal-evidence-worker
          LEGAL_EVIDENCE_OCR_ENGINE: rapidocr
          LEGAL_EVIDENCE_OCR_LANGUAGES: latin
          DOCLING_ARTIFACTS_PATH: /tmp/legal-evidence-worker/models
          HF_HUB_OFFLINE: 1
          HF_HUB_DISABLE_TELEMETRY: 1
          TRANSFORMERS_OFFLINE: 1
        run: |
          runtime_python=$(python3 -c 'import json; manifest=json.load(open("/tmp/legal-evidence-worker/runtime-manifest.json")); print("/tmp/legal-evidence-worker/" + manifest["python"]["executable"])')
          "$runtime_python" -m unittest discover -s tests -v
          "$runtime_python" scripts/smoke_packaged.py fixtures/generated/scan_page_1.png /tmp/legal-evidence-worker-smoke

      - name: Prove compiled workbench discovers the packaged worker
        working-directory: packages/desktop
        env:
          LEGAL_WORKBENCH_TEST_EXECUTABLE: /tmp/legal-workbench
          LEGAL_EVIDENCE_WORKER_TEST_DIR: /tmp/legal-evidence-worker
        run: |
          bun ./scripts/build-legal-workbench.ts /tmp/legal-workbench
          bun test ./src/main/legal-workbench.test.ts
