name: legal research

on:
  push:
    branches:
      - legal-research
    paths:
      - ".github/workflows/legal-research.yml"
      - ".github/workflows/legal-release-candidate.yml"
      - "packages/codex-app-server/**"
      - "packages/app/src/app.tsx"
      - "packages/app/src/i18n/en.ts"
      - "packages/app/src/pages/legal-research.tsx"
      - "packages/app/src/utils/legal-workbench-url*"
      - "packages/desktop/**"
      - "packages/legal-citation-spike/**"
      - "packages/legal-evaluation/**"
      - "packages/legal-evidence-worker/**"
      - "packages/legal-research-core/**"
      - "packages/legal-workbench/**"
      - "specs/legal-research/**"
      - "bun.lock"
      - "package.json"
  pull_request:
    paths:
      - ".github/workflows/legal-research.yml"
      - ".github/workflows/legal-release-candidate.yml"
      - "packages/codex-app-server/**"
      - "packages/app/src/app.tsx"
      - "packages/app/src/i18n/en.ts"
      - "packages/app/src/pages/legal-research.tsx"
      - "packages/app/src/utils/legal-workbench-url*"
      - "packages/desktop/**"
      - "packages/legal-citation-spike/**"
      - "packages/legal-evaluation/**"
      - "packages/legal-evidence-worker/**"
      - "packages/legal-research-core/**"
      - "packages/legal-workbench/**"
      - "specs/legal-research/**"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    name: dependency and secret gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Reject high or critical packaged-desktop advisories
        working-directory: packages/desktop
        run: bun run audit:security

      - name: Setup pinned uv audit runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.13
          enable-cache: false

      - name: Reject known evidence-worker vulnerabilities
        working-directory: packages/legal-evidence-worker
        run: |
          uv export --frozen --no-dev --no-hashes --output-file "${{ runner.temp }}/legal-evidence-worker-requirements.txt"
          uvx pip-audit@2.10.1 --requirement "${{ runner.temp }}/legal-evidence-worker-requirements.txt" --no-deps --disable-pip

      - name: Reject committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  legal:
    name: legal TypeScript gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck workspace
        run: bun typecheck

      - name: Verify desktop dependency license receipt
        working-directory: packages/desktop
        run: bun ./scripts/desktop-license-audit.ts --write=/tmp/THIRD_PARTY_LICENSES.desktop.json

      - name: Run legal unit and integration tests
        run: bun test:legal

      - name: Run primary-shell legal route tests
        working-directory: packages/app
        run: bun test --conditions=solid --preload ./happydom.ts ./src/utils/legal-workbench-url.test.ts

      - name: Build packaged legal workbench executable
        working-directory: packages/desktop
        run: bun ./scripts/build-legal-workbench.ts /tmp/legal-workbench

      - name: Run desktop legal sidecar tests
        working-directory: packages/desktop
        run: >-
          LEGAL_WORKBENCH_TEST_EXECUTABLE=/tmp/legal-workbench bun test
          ./src/main/legal-workbench.test.ts
          ./src/main/legal-web-renderer-policy.test.ts
          ./src/main/legal-web-renderer-proxy.test.ts
          ./src/main/legal-web-renderer-server.test.ts
          ./scripts/desktop-license-audit.test.ts
          ./scripts/evidence-worker-license-audit.test.ts
          ./scripts/legal-release-sbom.test.ts
          ./electron-builder.config.test.ts

  evidence-worker:
    name: packaged evidence worker gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install pinned uv builder
        run: python3 -m pip install --user --break-system-packages uv==0.11.13

      - name: Build relocatable Python, Docling, and OCR resource
        working-directory: packages/desktop
        timeout-minutes: 45
        env:
          UV: /home/runner/.local/bin/uv
        run: bun ./scripts/build-evidence-worker.ts /tmp/legal-evidence-worker

      - name: Verify dependency and model license receipt
        working-directory: packages/desktop
        run: bun ./scripts/evidence-worker-license-audit.ts /tmp/legal-evidence-worker

      - name: Run evidence worker tests from packaged Python
        working-directory: packages/legal-evidence-worker
        env:
          PYTHONPATH: /tmp/legal-evidence-worker
          LEGAL_EVIDENCE_OCR_ENGINE: rapidocr
          LEGAL_EVIDENCE_OCR_LANGUAGES: latin
          DOCLING_ARTIFACTS_PATH: /tmp/legal-evidence-worker/models
          HF_HUB_OFFLINE: 1
          HF_HUB_DISABLE_TELEMETRY: 1
          TRANSFORMERS_OFFLINE: 1
        run: |
          runtime_python=$(python3 -c 'import json; manifest=json.load(open("/tmp/legal-evidence-worker/runtime-manifest.json")); print("/tmp/legal-evidence-worker/" + manifest["python"]["executable"])')
          "$runtime_python" -m unittest discover -s tests -v
          "$runtime_python" scripts/smoke_packaged.py fixtures/generated/scan_page_1.png /tmp/legal-evidence-worker-smoke

      - name: Prove compiled workbench discovers the packaged worker
        working-directory: packages/desktop
        env:
          LEGAL_WORKBENCH_TEST_EXECUTABLE: /tmp/legal-workbench
          LEGAL_EVIDENCE_WORKER_TEST_DIR: /tmp/legal-evidence-worker
        run: |
          bun ./scripts/build-legal-workbench.ts /tmp/legal-workbench
          bun test ./src/main/legal-workbench.test.ts

      - name: Build unpacked Linux desktop and run installed legal sidecars
        working-directory: packages/desktop
        timeout-minutes: 30
        run: |
          mv /tmp/legal-evidence-worker resources/legal-evidence-worker
          bun run build
          npx electron-builder --linux --x64 --dir --publish never --config electron-builder.config.ts
          bun ./scripts/verify-legal-installation.ts dist/linux-unpacked/resources ../legal-evidence-worker/fixtures/generated/scan_page_1.png
