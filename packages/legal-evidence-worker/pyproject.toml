[project]
name = "legal-evidence-worker-spike"
version = "0.0.1"
description = "Isolated Docling provenance and OCR spike for Legal Builder"
requires-python = ">=3.12,<3.15"
dependencies = [
    "docling==2.121.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
